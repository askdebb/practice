<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- <script src="react-basics-copy.js"></script> -->

    <script src="https://unpkg.com/supersimpledev/dayjs.js">
      // console.log(dayjs());
    </script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const product = 'Cotton socks';
      const price = 10;

      const todayDate = dayjs().format('MMMM D');

      /**
      const name = 'Christopher';
      const div = (
        <div>
          <p>Product Name: {product}</p>
          <p>Price: ${price}</p>
          <button>Add to Cart</button>

        </div>
      );
      */

      const socks = 10;
      const tShirt = 8;

      const productCost = socks + 2 * tShirt;

      const shippingCost = 5;

      const totalCost = productCost + shippingCost;

      // console.log('Product cost: ', productCost);

      const div2 = (
        <div>
          <p>Product cost: ${productCost}</p>
          <p>Shipping cost: ${shippingCost}</p>
          <p>Total cost: ${totalCost}</p>
          <button>Place your order</button>

          <br />
          <br />
          <p>Today is {todayDate}</p>
        </div>
      );

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);

      setInterval(() => {
        const div3 = <p>Current Time is : {dayjs().format('hh:mm:ss')} </p>;
        root.render(div3);
      }, 500);
    </script>
  </body>
</html>
